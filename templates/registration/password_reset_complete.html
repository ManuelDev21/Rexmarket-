<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Actualizada | RexMarket</title>
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'img/rexmarket.png' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/verify.css' %}">
</head>
<body class="bg-light verify-body">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="card verify-card shadow-lg border-0 overflow-hidden" style="max-width: 460px; width: 100%;">
            <div class="card-body p-5 text-center">
                <div class="icon-circle mx-auto mb-4 d-flex align-items-center justify-content-center text-white bg-success">
                    <i class="bi bi-check-circle-fill display-4"></i>
                </div>
                <h3 class="fw-bold text-dark mb-2">¡Contraseña actualizada!</h3>
                <p class="text-muted small mb-4">Tu clave se ha restablecido correctamente. Ya puedes ingresar con tu RUT y tu nueva contraseña.</p>
                <a href="{% url 'login' %}" class="btn btn-primary w-100 btn-lg rounded-pill fw-bold">
                    Iniciar Sesión
                </a>
            </div>
        </div>
    </div>
</body>
</html>
