<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | RexMarket</title>
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'img/rexmarket.png' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/verify.css' %}">
</head>
<body class="bg-light verify-body">
    <a href="{% url 'login' %}" class="btn-back text-decoration-none">
        <i class="bi bi-arrow-left-short"></i> Volver al Login
    </a>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="card verify-card shadow-lg border-0 overflow-hidden" style="max-width: 460px; width: 100%;">
            <div class="card-body p-5 text-center">
                <div class="icon-circle mx-auto mb-4 d-flex align-items-center justify-content-center text-white">
                    <i class="bi bi-key-fill display-4"></i>
                </div>
                <h3 class="fw-bold text-dark mb-2">¿Olvidaste tu clave?</h3>
                <p class="text-muted small mb-4">
                    Ingresa tu correo institucional <strong>@inacapmail.cl</strong> y te enviaremos un enlace seguro para restablecer tu contraseña.
                </p>

                {% if form.email.errors %}
                    <div class="alert alert-danger border-0 shadow-sm text-start small mb-3" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        {{ form.email.errors|join:", " }}
                    </div>
                {% endif %}

                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-4 text-start">
                        <label for="id_email" class="form-label small fw-bold">Correo institucional</label>
                        <input
                            type="email"
                            name="email"
                            id="id_email"
                            class="form-control form-control-lg {% if form.email.errors %}is-invalid{% endif %}"
                            placeholder="usuario@inacapmail.cl"
                            value="{{ form.email.value|default:'' }}"
                            required
                            autofocus
                        >
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill fw-bold shadow-sm">
                        Enviar Enlace de Recuperación <i class="bi bi-envelope-arrow-up ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
