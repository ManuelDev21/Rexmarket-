<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conectando con Webpay Plus...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm border-0 rounded-4 p-4 text-center" style="max-width: 420px;">
        <div class="spinner-border text-warning mx-auto mb-3" role="status"></div>
        <h5 class="fw-bold mb-1">Redirigiendo a Transbank Webpay Plus</h5>
        <p class="text-muted small mb-3">
            {% if pago.dias %}
                Plan Destacado ({{ pago.dias }} día{{ pago.dias|pluralize }}):
            {% else %}
                Comisión de publicación:
            {% endif %}
            <strong>${{ pago.monto_comision }} CLP</strong><br>
            Orden: <code>{{ pago.buy_order }}</code>
        </p>
        <form id="form-webpay" action="{{ url_webpay }}" method="POST">
            <input type="hidden" name="token_ws" value="{{ token_ws }}">
            <button type="submit" class="btn btn-warning btn-sm fw-semibold">
                Continuar a Webpay si no redirige automáticamente
            </button>
        </form>
    </div>

    <script>
        document.getElementById('form-webpay').submit();
    </script>
</body>
</html>
