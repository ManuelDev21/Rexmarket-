{% extends 'base/base.html' %}

{% block titulo %}Página no encontrada (404){% endblock %}

{% block contenido %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="display-1 fw-bold text-primary">404</h1>
      <h3 class="mb-3">¡Página no encontrada!</h3>
      <p class="text-muted mb-4">
        La ruta a la que intentas acceder no existe, fue eliminada o no tienes permisos para verla.
      </p>
      <a href="{% url 'profile' %}" class="btn btn-primary px-4">
        Volver al inicio
      </a>
    </div>
  </div>
</div>
{% endblock %}
